name: Update Key Automatically

on:
  schedule:
    - cron: '0 0 * * *'  # Запускать каждый день в 00:00 UTC
  workflow_dispatch:      # Позволяет запускать действие вручную

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate new key
        run: |
          # Генерируем новый случайный ключ
          NEW_KEY=$(openssl rand -hex 16)
          echo $NEW_KEY > key.txt

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@users.noreply.github.com"
          git add key.txt
          git commit -m "Auto-update key: $(date)"
          git push
